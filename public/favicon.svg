<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="luerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 12"/>
  
  <!-- Luer Lock Connector Emblem -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- 6% Male Cone Taper -->
    <path d="M 210,130 L 302,130 L 284,330 L 228,330 Z" fill="url(#luerGrad)"/>
    <!-- Inner Fluid Channel -->
    <path d="M 244,130 L 268,130 L 268,330 L 244,330 Z" fill="#3b82f6"/>
    <!-- Outer Threaded Collar -->
    <rect x="176" y="330" width="160" height="32" rx="8" fill="#ffffff"/>
    <rect x="192" y="374" width="128" height="24" rx="6" fill="#cbd5e1"/>
    <!-- Luer Thread Helices -->
    <path d="M 160,346 C 160,346 176,330 256,330 C 336,330 352,346 352,346 C 352,346 336,362 256,362 C 176,362 160,346 160,346 Z" fill="none" stroke="#2563eb" stroke-width="6"/>
  </g>
</svg>
